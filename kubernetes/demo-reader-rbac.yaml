apiVersion: v1
kind: Namespace
metadata:
  name: nono-demo-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nono-demo-reader
  namespace: nono-demo-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nono-demo-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nono-demo-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nono-demo-reader
subjects:
  - kind: ServiceAccount
    name: nono-demo-reader
    namespace: nono-demo-system
