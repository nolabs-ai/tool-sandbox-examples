speed: 80
delay: 50
clear: true
show_exit_status: false

setup:
  - export GH_PROFILE=./ghcli-profile-macos.json

steps:
  - pause
  - text: >-
      jq '{approval_backends: .command_policies.approval_backends, credential: .command_policies.credentials["github-api"].credential_key}' "$GH_PROFILE"
  - comment: ""

  - pause
  - text: >-
      jq '{command_approve: .command_policies.commands.gh.from.session.invocation_policy.approve, endpoint_approve: .command_policies.commands.gh.from.session.sandbox.credentials[0].endpoint_policy.approve}' "$GH_PROFILE"
  - comment: ""

  - pause
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$GH_PROFILE" -- gh auth token
  - comment: ""

  - pause
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$GH_PROFILE" -- gh api rate_limit | jq '{core: .resources.core}'
  - comment: ""

  - pause
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$GH_PROFILE" -- gh issue view 1052 --repo always-further/nono --json title,url,state | jq
  - comment: ""

  - pause
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$GH_PROFILE" -- gh api repos/always-further/nono/issues/1052 | jq .title
  - comment: ""

  - pause
  - text: >-
      nono run -s --no-audit --no-diagnostics --allow-cwd --profile "$GH_PROFILE" -- gh issue comment 1052 --repo always-further/nono --body 'nono arg deny test'
  - comment: ""

  - pause
  - text: >-
      nono run -s --no-audit --no-diagnostics --allow-cwd --profile "$GH_PROFILE" -- gh api -X POST repos/always-further/nono/issues/1052/comments -f body='nono L7 deny test'
  - comment: ""

  - pause
  - text: >-
      nono run -s --no-audit --no-diagnostics --allow-cwd --profile "$GH_PROFILE" -- sh -c 'gh issue comment 1052 --repo always-further/nono --body "wrapped bypass attempt"'
  - comment: ""
