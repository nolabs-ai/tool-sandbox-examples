speed: 80
delay: 50
clear: true
show_exit_status: false

setup:
  - export GH_PROFILE=./ghcli-profile-macos.json
  - export BASIC_PROFILE=./basic.json

steps:
  - pause
  - text: echo $GH_PROFILE
  - text: echo $BASIC_PROFILE

  - text: cat "$GH_PROFILE" | jq -C . | less -R

  # ------------------------------------------------------------------
  # Credential brokering: L7 injects a phantom token, basic has none.
  # ------------------------------------------------------------------
  - pause
  - comment: "L7: proxy injects a phantom GH_TOKEN; the real token never enters the sandbox."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$GH_PROFILE" -- gh auth token

  - pause
  - comment: "basic: no credential granted -- gh finds no token at all."
    style: blue
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$BASIC_PROFILE" -- gh auth token

  - pause
  - comment: "Environment: no phantom GH_TOKEN injected -- the variable is empty."
    style: blue
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$BASIC_PROFILE" -- sh -c 'echo "GH_TOKEN=[$GH_TOKEN]"'

  - pause
  - comment: "On-disk config: hosts.yml holds no token, just username and protocol."
    style: blue
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$BASIC_PROFILE" -- cat "$HOME/.config/gh/hosts.yml"

  - pause
  - comment: "Keychain: where the token really lives -- the sandbox seals the store on disk."
    style: blue
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$BASIC_PROFILE" -- cat "$HOME/Library/Keychains/login.keychain-db"

  # ------------------------------------------------------------------
  # Authenticated vs anonymous: same request, with and without the token.
  # ------------------------------------------------------------------
  - pause
  - comment: "L7: authenticated -- proxy swaps in the real token, so the limit is 5000."
    style: blue
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$GH_PROFILE" -- gh api rate_limit | jq '{core: .resources.core}'

  - pause
  - comment: "basic: same command, no credential -- anonymous, the limit drops to 60."
    style: blue
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$BASIC_PROFILE" -- gh api rate_limit | jq '{core: .resources.core}'

  - pause
  - comment: "L7: even a raw curl with an empty header succeeds -- the proxy injects the real token."
    style: blue
  - text: |-
      nono run -s --allow-cwd --profile "$GH_PROFILE" -- \
        curl -s -H "Authorization: token $GH_TOKEN" \
        https://api.github.com/rate_limit \
        | jq '{core: .resources.core}'

  # ------------------------------------------------------------------
  # High-level issue read: allowed under L7, rejected without a token.
  # ------------------------------------------------------------------
  - pause
  - comment: "L7: allowed read -- gh issue view succeeds."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$GH_PROFILE" -- gh issue view 1052 --repo nolabs-ai/nono --json title,url,state | jq

  - pause
  - comment: "basic: no token -- the same read is rejected (HTTP 401)."
    style: blue
  - text: >-
      nono run -s --no-audit --allow-cwd --profile "$BASIC_PROFILE" -- gh issue view 1052 --repo nolabs-ai/nono --json title,url,state

  # ------------------------------------------------------------------
  # L7 policy enforcement: reads allowed, every mutation denied, audited.
  # ------------------------------------------------------------------
  - pause
  - comment: "Endpoint allow policy: GET issue paths are permitted."
    style: blue
  - text: >-
      jq '.command_policies.commands.gh.from.session.sandbox.credentials[0].endpoint_policy.allow | map(select(.method=="GET" and (.path|test("issues")))) | map(.path)' "$GH_PROFILE"

  - pause
  - comment: "Allowed read: gh api on a permitted GET issue path."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$GH_PROFILE" -- gh api repos/nolabs-ai/nono/issues/1052 --jq .title

  - pause
  - comment: "Invocation deny policy: issue mutations blocked by argv."
    style: blue
  - text: >-
      jq '.command_policies.commands.gh.from.session.invocation_policy.deny | map(select(.argv.prefix[0]=="issue")) | map(.argv.prefix|join(" "))' "$GH_PROFILE"

  - pause
  - comment: "Arg deny: gh issue comment blocked before any API call."
    style: blue
  - text: >-
      nono run -s --no-audit --no-diagnostics --allow-cwd --profile "$GH_PROFILE" -- gh issue comment 1052 --repo nolabs-ai/nono --body 'nono arg deny test'

  - pause
  - comment: "Arg deny: gh issue create blocked too."
    style: blue
  - text: >-
      nono run -s --no-audit --no-diagnostics --allow-cwd --profile "$GH_PROFILE" -- gh issue create --repo nolabs-ai/nono --title 'nono arg deny test' --body 'should not be created'

  - pause
  - comment: "L7 deny: proxy blocks the POST to the comments endpoint."
    style: blue
  - text: >-
      nono run -s --no-audit --no-diagnostics --allow-cwd --profile "$GH_PROFILE" -- gh api -X POST repos/nolabs-ai/nono/issues/1052/comments -f body='nono L7 deny test'

  - pause
  - comment: "L7 deny: proxy blocks POST /user too."
    style: blue
  - text: >-
      nono run -s --no-audit --no-diagnostics --allow-cwd --profile "$GH_PROFILE" -- gh api -X POST user

  - pause
  - comment: "Child mediation: wrapping gh in sh does not bypass policy."
    style: blue
  - text: >-
      nono run -s --no-audit --no-diagnostics --allow-cwd --profile "$GH_PROFILE" -- sh -c 'gh issue comment 1052 --repo nolabs-ai/nono --body "wrapped bypass attempt"'

  - pause
  - comment: "Audit trail: the policy decisions nono recorded for a recent command."
    style: blue
  - text: "nono audit list --recent 5"
    capture:
      name: audit_id
      pattern: '([0-9a-f]{16})'
  - text: "nono audit show {audit_id} --json | jq '.command_policy_events | map({sequence, command, decision, reason, argv: .argv_display})'"

  # ------------------------------------------------------------------
  # Same policy, autonomous agent: this profile extends nolabs-ai/claude,
  # so Claude Code runs under it and every gh call it makes is mediated.
  # ------------------------------------------------------------------
  - pause
  - comment: "This profile extends the Claude Code profile, so the agent inherits the same gh policy."
    style: blue
  - text: >-
      jq '{extends, gh_allow: [.command_policies.commands.gh.from.session.invocation_policy.allow[].argv | (.prefix // .exact) | join(" ")], gh_deny: [.command_policies.commands.gh.from.session.invocation_policy.deny[].argv | (.prefix // .exact) | join(" ")]}' "$GH_PROFILE"

  - pause
  - comment: "Agent read: Claude uses gh to read the issue -- allowed."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$GH_PROFILE" -- claude 'Use gh to fetch the title and state of issue 1052 in the nolabs-ai/nono repo, then report just those.' --dangerously-skip-permissions --allowedTools Bash

  - pause
  - comment: "Agent write: Claude tries to comment -- nono blocks the gh mutation at the tool boundary."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$GH_PROFILE" -- claude 'Use gh to post a comment saying hello on issue 1052 in the nolabs-ai/nono repo. If it fails, tell me exactly why.' --dangerously-skip-permissions --allowedTools Bash
